site_name: "KGCL"
site_description: "Knowledge Graph Change Language: a standard for describing changes to ontologies and knowledge graphs"
site_url: https://incatools.github.io/kgcl/
repo_url: https://github.com/INCATools/kgcl
theme:
  name: material
  analytics:
    gtag: G-2SYBSJVZ23
  features:
    - content.tabs.link
    - navigation.sections
    - navigation.top
plugins:
  - search
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
docs_dir: docs
site_dir: mkdocs_html
nav:
  - Home: main.md
  - Using KGCL:
      - Visual guide to change types: change-types.md
      - Command examples: examples.md
      - Class hierarchy: class-hierarchy.md
  - Tools:
      - Ontobot (GitHub): github-integration.md
      - BioPortal: bioportal-implementation.md
  - Schema reference: index.md
  - Citing KGCL: about.md
extra_javascript:
  - class_tree.js
